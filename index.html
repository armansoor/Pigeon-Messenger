<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pigeon Messenger 🐦</title>
    
    <!-- Leaflet Maps CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- NAVIGATION -->
        <nav id="main-nav">
            <div class="nav-brand">🐦 Pigeon</div>
            <div class="nav-links">
                <button onclick="switchView('view-home')">🏠 Home</button>
                <button onclick="switchView('view-chat')">💌 Chat</button>
                <button onclick="switchView('view-map')">🗺️ Map</button>
            </div>
        </nav>

        <!-- CONTENT AREA -->
        <div id="content-area">
            <!-- HOME SCREEN -->
            <div id="view-home" class="view active">
                <header>
                    <h1>Dashboard</h1>
                </header>
                <div class="content">
                    <div class="card stats-card">
                        <h3>📊 Network Stats</h3>
                        <p>Active Pigeons: <span id="stat-active">0</span></p>
                        <p>Messages Waiting: <span id="stat-waiting">0</span></p>
                        <p>Total Flights: <span id="stat-flights">37</span></p>
                        <p>Total Distance: <span id="stat-distance">4821</span> km</p>
                    </div>

                    <h3 class="section-title">🕊️ Active Flights</h3>
                    <div id="active-flights-list">
                        <!-- Flights injected via JS -->
                    </div>
                </div>
            </div>

            <!-- CHAT SCREEN -->
            <div id="view-chat" class="view">
                <header>
                    <h2>Chat with Alice</h2>
                </header>
                <div id="chat-messages" class="content">
                    <!-- Messages injected via JS -->
                </div>
                <form class="chat-input-area" onsubmit="event.preventDefault(); sendPigeon();">
                    <input type="text" id="message-input" placeholder="Write a message...">
                    <button type="submit">Send 🐦</button>
                </form>
            </div>

            <!-- MAP SCREEN -->
            <div id="view-map" class="view">
                <div id="map"></div>

                <div class="map-panel" id="map-panel">
                    <!-- Map UI injected via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet Maps JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
